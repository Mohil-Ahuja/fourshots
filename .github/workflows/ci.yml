name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]" coverage

      - name: Tests
        run: coverage run -m pytest -q

      - name: Coverage
        run: coverage report --include="src/*" --fail-under=95

      # Coverage says lines ran; this says a bug in them would be caught.
      # Exits non-zero if any deliberate defect survives the suite.
      - name: Mutation audit
        run: python tools/mutation_audit.py

      # Reproducing the benchmark proves the code runs. It says nothing about
      # whether the prose still quotes it correctly -- which is how stale
      # numbers survived twice. The test suite above covers this
      # (test_published_numbers.py); this step surfaces it as its own line so
      # a documentation failure is not mistaken for a code failure.
      - name: Documents quote current figures
        run: python -m pytest tests/test_published_numbers.py -q

      - name: Reproduce the headline result
        run: python -m fourshots.benchmark --sweep
