name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]" coverage

      - name: Tests
        run: coverage run -m pytest -q

      - name: Coverage
        run: coverage report --include="src/*" --fail-under=95

      # Coverage says lines ran; this says a bug in them would be caught.
      # Exits non-zero if any deliberate defect survives the suite.
      - name: Mutation audit
        run: python tools/mutation_audit.py

      # Reproducing the benchmark proves the code runs. It says nothing about
      # whether the prose still quotes it correctly -- which is how stale
      # numbers survived twice. The test suite above covers this
      # (test_published_numbers.py); this step surfaces it as its own line so
      # a documentation failure is not mistaken for a code failure.
      - name: Documents quote current figures
        run: python -m pytest tests/test_published_numbers.py -q

      - name: Reproduce the headline result
        run: python -m fourshots.benchmark --sweep

  differential:
    # The regulatory gate is written twice -- Python and Rust, independently --
    # and this job asserts the two agree. It is a separate job because the
    # oracle is not part of the shipped path: if the Rust toolchain is
    # unavailable the differential test skips and everything else still runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust unit tests
        working-directory: rust
        run: cargo test --lib

      - name: Build the oracle
        run: |
          pip install maturin
          cd rust && maturin build --release

      - name: Install and run the differential test
        run: |
          pip install -e ".[dev]"
          pip install --force-reinstall rust/target/wheels/fourshots_rules-*.whl
          pytest tests/test_differential.py -q
