[project]
name = "fourshots"
version = "0.1.0"
description = "Attempt-budget allocation for Indian recurring payments. NPCI gives you four attempts; this decides how to spend them."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
# Only needed to refresh the triage cache. The benchmark reads a committed
# file and never calls a model, so the default install deliberately omits it.
ai = ["anthropic>=0.40"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
