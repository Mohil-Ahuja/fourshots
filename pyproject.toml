[project]
name = "fourshots"
version = "0.1.0"
description = "Attempt-budget allocation for Indian recurring payments. NPCI gives you four attempts; this decides how to spend them."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
